name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository source
        run: jq empty repo.json
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ReddSaveMedia.xcodeproj \
            -scheme ReddSaveMedia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p artifact/Payload
          cp -R build/Build/Products/Release-iphoneos/ReddSaveMedia.app artifact/Payload/
          (cd artifact && zip -qry ReddSaveMedia.ipa Payload)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReddSaveMedia-unsigned-ipa
          path: artifact/ReddSaveMedia.ipa
          if-no-files-found: error
